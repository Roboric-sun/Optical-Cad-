name: Build and validate
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy
        run: cmake --install build --config Release --prefix release
      - name: Verify standalone macOS package
        if: runner.os == 'macOS'
        run: python3 scripts/verify_macos_package.py release/optical_cad.app
      - uses: actions/upload-artifact@v4
        with:
          name: optical-cad-${{ matrix.os }}
          path: release
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DOPTICS_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
