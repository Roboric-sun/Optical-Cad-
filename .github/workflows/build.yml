name: Build and validate
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt: '6.11.1'
          - os: windows-latest
            qt: '6.8.3'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true
          setup-python: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Learning example on macOS
        if: runner.os == 'macOS'
        run: ./build/optics_learning 70
      - name: Learning example on Windows
        if: runner.os == 'Windows'
        run: .\build\Release\optics_learning.exe 70
      - name: Deploy
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/release"
      - name: Verify standalone macOS package
        if: runner.os == 'macOS'
        run: python3 scripts/verify_macos_package.py release/optical_cad.app
      - name: Accept deployed app in a fresh user directory
        run: python scripts/verify_installation.py release artifacts/installation-${{ runner.os }}.json
      - name: Independent Geopter and diffraction acceptance
        if: runner.os == 'macOS'
        run: |
          python -m pip install numpy==2.3.5
          python scripts/benchmarks/fetch_geopter.py reference/Geopter
          python scripts/benchmarks/build_geopter_probe.py reference/Geopter reference/build
          python scripts/benchmarks/compare_geopter.py reference/build/geopter_probe build/optics_batch artifacts/geopter
          OPENBLAS_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 python scripts/benchmarks/verify_diffraction.py reference/build/geopter_probe build/optics_batch artifacts/diffraction
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: independent-reference
          path: |
            artifacts/geopter/summary.json
            artifacts/diffraction/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: artifacts/installation-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: optical-cad-${{ matrix.os }}
          path: release
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(OpticalCAD VERSION ([0-9.]+)').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Optical CAD installed"
          $process = Start-Process artifacts/OpticalCAD-Setup-Windows-x64.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QPA_FONTDIR = "$env:SystemRoot/Fonts"
          $env:OPTICALCAD_PYTHON = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = ""
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = ""
          $process = Start-Process "$destination/bin/optical_cad.exe" -ArgumentList "--verify-installation `"$env:RUNNER_TEMP/installer-check.json`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/installer-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP/installer-stderr.txt"
          Get-Content "$env:RUNNER_TEMP/installer-stdout.txt", "$env:RUNNER_TEMP/installer-stderr.txt"
          if (Test-Path "$env:RUNNER_TEMP/installer-check.json") { Get-Content "$env:RUNNER_TEMP/installer-check.json" }
          if ($process.ExitCode -ne 0) { throw "Installed application failed: $($process.ExitCode)" }
          $report = Get-Content "$env:RUNNER_TEMP/installer-check.json" -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw "Installed application acceptance failed" }
          $process = Start-Process "$destination/unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed" }
      - name: Prepare macOS download
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp release/OpticalCAD-*-macOS-arm64.zip artifacts/OpticalCAD-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ runner.os }}
          path: |
            artifacts/OpticalCAD-Setup-Windows-x64.exe
            artifacts/OpticalCAD-macOS-arm64.zip
          if-no-files-found: error
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DOPTICS_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/optics_learning 70
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [desktop, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          merge-multiple: true
          path: downloads
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: desktop-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cd downloads
          sha256sum OpticalCAD-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" OpticalCAD-* SHA256SUMS.txt --target "$RELEASE_SHA" --latest --title "Optical CAD — build ${{ github.run_number }}" --notes "Windows x64: download OpticalCAD-Setup-Windows-x64.exe and run the installer. macOS Apple Silicon: download OpticalCAD-macOS-arm64.zip and extract. Built and tested from main ($RELEASE_SHA). Packages are not signed with a publisher certificate; operating system security prompts may appear. Python scripting requires Python 3 installed separately."
